<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autopostleey — offline</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F4F6F9;color:#0D1117;
       font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px;text-align:center}
  .b{max-width:400px}
  .l{width:72px;height:72px;border-radius:18px;margin:0 auto 18px;display:grid;place-items:center;
     background:linear-gradient(135deg,#6D5EF8,#EC4899);color:#fff;font-weight:800;font-size:26px}
  h1{font-size:21px;margin:0 0 8px}
  p{color:#3D4451;margin:0 0 20px}
  button{padding:13px 26px;border:none;border-radius:10px;font-size:15px;font-weight:700;color:#fff;
         background:linear-gradient(135deg,#6D5EF8,#EC4899);cursor:pointer}
  small{display:block;margin-top:18px;color:#6B7280}
</style></head><body>
<div class="b">
  <div class="l">AP</div>
  <h1>You're offline</h1>
  <p>Autopostleey needs a connection to reach your accounts and load your posts.
     Everything you've scheduled is safe and will still go out — that happens on our servers,
     not on your phone.</p>
  <button onclick="location.reload()">Try again</button>
  <small>Autopostleey</small>
</div>
</body></html>
